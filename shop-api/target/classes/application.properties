spring.application.name=shop-api
spring.datasource.url=jdbc:mysql://localhost:3306/shop_api?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=shop_user
spring.datasource.password=shop_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
springdoc.override-with-generic-response=false
springdoc.show-actuator=false
springdoc.servers=
springdoc.swagger-ui.disable-swagger-default-url=true
