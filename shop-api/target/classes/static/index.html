<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shop API Admin Server</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <span class="navbar-brand">Shop System Server Dashboard</span>
    </div>
</nav>

<div class="container">
    <ul class="nav nav-pills nav-fill mb-4 shadow-sm bg-white p-2 rounded" id="entityTabs" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-resource="products" onclick="loadEntity('products')">Products</button></li>
        <li class="nav-item"><button class="nav-link" data-resource="categories" onclick="loadEntity('categories')">Categories</button></li>
        <li class="nav-item"><button class="nav-link" data-resource="customers" onclick="loadEntity('customers')">Customers</button></li>
        <li class="nav-item"><button class="nav-link" data-resource="orders" onclick="loadEntity('orders')">Orders</button></li>
        <li class="nav-item"><button class="nav-link" data-resource="order-items" onclick="loadEntity('order-items')">Order Items</button></li>
    </ul>

    <div class="row">
        <div class="col-md-4">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-success text-white">POST: Create Record</div>
                <div class="card-body" id="form-container"></div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                    <span>GET: Data List</span>
                    <div class="d-flex gap-2 align-items-center">
                        <div id="data-controls" class="d-flex gap-2 align-items-center"></div>
                        <button class="btn btn-outline-light btn-sm" onclick="refreshData()">Refresh</button>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead id="table-head"></thead>
                            <tbody id="table-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="js/api.js?v=2"></script>
<script src="js/app.js?v=5"></script>
</body>
</html>
